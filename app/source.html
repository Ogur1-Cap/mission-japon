<title>Mission Japon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: une ligne de train Osaka → Tokyo ; chaque étape est un panneau de gare (ekimeihyō), le compte à rebours est un tableau des départs LED. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#141C2B; --muted:#5A6577; --line:#D6DCE5;
  --accent:#2B3A8C; --accent-ink:#FFFFFF; --ok:#1F8A4C; --ok-bg:#E3F4EA; --ko:#C93A3A; --ko-bg:#FBE7E6;
  --led-bg:#121212; --led-fg:#FFB21E; --led-dim:#5a4612;
  --c-osaka:#EE7B00; --c-nara:#A8662A; --c-kyoto:#7E3FA0; --c-kanazawa:#0E93A0; --c-fuji:#2F66D0; --c-tokyo:#5AA62A;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-led:"DotGothic16","Zen Kaku Gothic New",monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121A; --surface:#161D28; --surface-2:#1C2533; --ink:#E8EDF5; --muted:#9AA5B7; --line:#2A3445;
  --accent:#8EA0FF; --accent-ink:#0D121A; --ok:#4CC783; --ok-bg:#15301F; --ko:#FF7A73; --ko-bg:#3A1A1A;
  --c-osaka:#FF9A2E; --c-nara:#C98A4E; --c-kyoto:#B77AD9; --c-kanazawa:#2EC0CC; --c-fuji:#6E9CFF; --c-tokyo:#86CF55;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121A; --surface:#161D28; --surface-2:#1C2533; --ink:#E8EDF5; --muted:#9AA5B7; --line:#2A3445;
  --accent:#8EA0FF; --accent-ink:#0D121A; --ok:#4CC783; --ok-bg:#15301F; --ko:#FF7A73; --ko-bg:#3A1A1A;
  --c-osaka:#FF9A2E; --c-nara:#C98A4E; --c-kyoto:#B77AD9; --c-kanazawa:#2EC0CC; --c-fuji:#6E9CFF; --c-tokyo:#86CF55;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.jp{font-family:var(--f-body);font-weight:700}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .seal{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:22px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,5vw,34px);line-height:1.05;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* LED board */
.led{background:var(--led-bg);color:var(--led-fg);border-radius:var(--r);padding:14px 18px;font-family:var(--f-led);display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:center;box-shadow:inset 0 0 0 2px #2a2a2a}
.led .lbl{font-size:12px;color:#c9c9c9;letter-spacing:.08em}
.led .big{font-size:clamp(30px,7vw,44px);line-height:1;text-shadow:0 0 8px rgba(255,178,30,.45)}
.led .row{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;border-top:1px dashed #333;padding-top:8px}
.led .dest{font-size:clamp(16px,3.6vw,20px)}
.led .blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* today card */
.today{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.today h2{font-size:20px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:400}
.stat span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 14px;font-size:14px}
@media (max-width:520px){.today{grid-template-columns:1fr}.today .btn{width:100%}}

/* route */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px;gap:12px}
.sec-h h2{font-size:18px}
.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.route{grid-template-columns:repeat(2,minmax(0,1fr))}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;position:relative;transition:transform .15s}
.board:hover{transform:translateY(-2px)}
.board .num{position:absolute;top:10px;left:10px;width:30px;height:30px;border:3px solid var(--lc);border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;line-height:1;background:var(--surface)}
.board .num em{font-style:normal;font-size:13px}
.board .body{padding:44px 12px 10px;text-align:center}
.board .kana{font-size:12px;color:var(--muted)}
.board .kanji{font-size:clamp(28px,6vw,38px);font-weight:700;line-height:1.1;letter-spacing:.06em}
.board .ro{font-size:13px;font-weight:500}
.board .theme{font-size:12px;color:var(--muted);margin-top:4px;min-height:2.6em}
.board .stripe{background:var(--lc);color:#fff;display:flex;justify-content:space-between;font-size:11px;padding:5px 8px;font-weight:700;gap:6px}
.board .stripe span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .prog{height:5px;background:var(--surface-2)}
.board .prog i{display:block;height:100%;background:var(--lc)}
.board.current{box-shadow:0 0 0 3px var(--lc)}
.board .here{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:var(--lc);color:#fff;border-radius:999px;padding:2px 8px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button .g{font-size:20px;font-weight:700;line-height:1.1}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .g{transform:scale(1.1)}

/* session */
.sbar{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.sbar .track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar .track i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sbar .time{font-family:var(--f-led);font-size:18px;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.card .kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.card .prompt{margin:18px 0 6px;font-size:clamp(56px,16vw,96px);line-height:1.1;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.card .prompt.mid{font-size:clamp(24px,6.5vw,36px)}
.card .prompt.fr{font-size:clamp(20px,5vw,28px);font-weight:500}
.card .sub{color:var(--muted);min-height:1.5em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.choices.one{grid-template-columns:1fr}
.choice{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 10px;font-size:18px;font-weight:700;min-height:58px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.choice.long{font-size:16px;font-weight:500}
.choice .k{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:500}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ko{border-color:var(--ko);background:var(--ko-bg)}
.choice:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:12px;padding:12px 14px;text-align:left;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg)}
.feedback.ko{background:var(--ko-bg)}
.feedback .t{font-weight:700}
.typein{display:flex;gap:8px;margin-top:18px}
.typein input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.audio{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;font-size:18px;vertical-align:middle}
.audio.big{width:84px;height:84px;font-size:34px;margin:18px auto 6px}
.done{text-align:center;padding:30px 18px}
.done .stamp{font-family:var(--f-body);font-weight:700;width:120px;height:120px;border-radius:50%;border:5px solid var(--ko);color:var(--ko);display:grid;place-items:center;margin:0 auto 14px;font-size:30px;transform:rotate(-8deg)}

/* lexique */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}
.kcell{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;text-align:center;position:relative}
.kcell .c{font-size:26px;font-weight:700;line-height:1.2}
.kcell .r{font-size:11px;color:var(--muted)}
.kcell .m{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:3px;background:var(--line)}
.kcell.empty{visibility:hidden}
.lv0 .m{background:var(--line)} .lv1 .m{background:var(--ko)} .lv2 .m{background:#E6A23C} .lv3 .m{background:#C9B53A} .lv4 .m,.lv5 .m,.lv6 .m{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.klist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.kj{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;position:relative;overflow:hidden}
.kj .c{grid-row:span 2;font-size:28px;font-weight:700}
.kj .r{font-size:12px;color:var(--muted)}
.kj .f{font-size:14px;font-weight:500}
.kj .m{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}

/* chapter */
.chap-head{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.chap-head .body{padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chap-head .kanji{font-size:44px;font-weight:700;letter-spacing:.06em;line-height:1}
.chap-head .stripe{height:10px;background:var(--lc)}
.plist{display:grid;gap:8px;margin-top:14px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.ph .j{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.ph .k,.ph .ro{font-size:13px;color:var(--muted)}
.ph .f{font-size:14px}
.ph .audio{grid-row:1/span 4;grid-column:2}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:8px}

/* roles */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.scene{border:1px solid var(--line);border-left:6px solid var(--lc);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:grid;gap:4px}
.scene b{font-size:16px}
.scene span{font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;min-width:0}
.bub.npc{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub .j{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.bub .ro{font-size:13px;opacity:.75}
.bub .f{font-size:13px;margin-top:4px;color:var(--muted)}
.bub .tr{background:none;border:0;padding:0;font-size:12px;color:var(--accent);font-weight:700;margin-top:4px}
.bub .who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{align-self:stretch;font-size:14px;border-radius:12px;padding:10px 12px}
.note.ok{background:var(--ok-bg)} .note.ko{background:var(--ko-bg)}
.composer{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;margin-top:14px;background:var(--bg);padding-block:8px}
.composer input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.sync{font-size:12px;color:var(--muted)}
/* animations */
.view-in{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.enter{animation:cardIn .34s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(28px) rotate(1.2deg)}to{opacity:1;transform:none}}
.card{position:relative}
.card.good{animation:good .5s ease-out}
@keyframes good{0%{box-shadow:0 0 0 0 var(--ok)}40%{box-shadow:0 0 0 6px var(--ok-bg);transform:scale(1.015)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.card.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.choice{transition:transform .12s,border-color .15s,background .15s}
.choice:active:not(:disabled){transform:scale(.97)}
.float{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-weight:700;font-size:28px;color:var(--ok);pointer-events:none;animation:floatUp .9s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.stamp-drop{animation:stampDrop .65s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampDrop{from{opacity:0;transform:scale(2.4) rotate(-28deg)}70%{opacity:1}to{opacity:1;transform:scale(1) rotate(-8deg)}}
.led .big span{display:inline-block;animation:ledOn .5s steps(3) both}
@keyframes ledOn{0%{opacity:0}40%{opacity:.9}55%{opacity:.2}100%{opacity:1}}
.rail{position:relative;height:56px;margin:6px 4px 14px}
.rail .line{position:absolute;left:12px;right:12px;top:34px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c-osaka),var(--c-nara),var(--c-kyoto),var(--c-kanazawa),var(--c-fuji),var(--c-tokyo))}
.rail .st{position:absolute;top:29px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--lc)}
.rail .st.done{background:var(--lc)}
.rail .train{position:absolute;top:0;margin-left:-17px;font-size:30px;line-height:1;transition:left 1.6s cubic-bezier(.45,0,.2,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.rail .train.go{animation:bob .5s ease-in-out 3}
@keyframes bob{50%{transform:translateY(-3px)}}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,14,22,.55);padding:24px;animation:viewIn .25s}
.overlay .box{background:var(--surface);border-radius:20px;padding:26px 22px;text-align:center;max-width:340px;width:100%}
.overlay .stamp{width:140px;height:140px;border-radius:50%;border:6px solid var(--lc);color:var(--lc);display:grid;place-items:center;margin:0 auto 14px;font-weight:700;font-size:26px;line-height:1.2;transform:rotate(-8deg)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.intro-in .prompt{animation:introPop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes introPop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
.stat b{transition:color .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
